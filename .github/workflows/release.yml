# 小白记账 自动打包发布工作流
# 触发方式：推送 v 开头的标签（如 v1.0.0、v1.1.0）时自动执行
# 功能：同时在 GitHub 云端的 Windows 和 Mac 服务器上打包，生成两个安装包并发布到 Releases 页面

name: Build and Release

on:
  push:
    tags:
      - 'v*'

# 授权：允许创建 Release 并上传安装包文件
permissions:
  contents: write

jobs:
  release:
    # 矩阵构建：同一套步骤分别在 Windows 和 Mac 服务器上各跑一遍
    # Windows 服务器生成 .exe 安装包，Mac 服务器生成 .dmg 安装包
    strategy:
      # 不要因为一台失败就取消另一台——万一 Mac 出问题，
      # Windows 的安装包仍然能正常打出来并上传。
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # 1. 把代码复制到云服务器
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. 安装 Node.js（打包工具的运行环境）
      #    必须 20 以上：electron-vite 要求 20.19+、cross-env 和 vitest 要求 20+。
      #    这里用 22（长期支持版），比最低要求高一点，留出余量。
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 3. 安装项目依赖
      - name: Install dependencies
        run: npm install

      # 4. 构建（用 npm run 方式，npm 会自动找到项目里的构建工具）
      #    注意：不能直接写 electron-vite，因为云服务器上不会自动加入搜索路径
      - name: Build
        run: npm run build

      # 5. 打包 + 发布（npx 会自动找到项目本地安装的 electron-builder）
      #    --publish always 表示构建成功后自动创建 Release 并上传安装包
      #    Mac 服务器没有签名证书，显式关闭签名查找（CSC_IDENTITY_AUTO_DISCOVERY=false）
      - name: Package and publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
